<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f1"><title>רשימת הקניות של אייל</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mut:#6b7280;--ac:#2f7d4f;--acbg:#e3f3ea;--bd:#e5e3dc;--btn:#efede6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,Arial,sans-serif}main{max-width:600px;margin:auto;padding:18px 14px 48px}h1{font-size:25px;margin:8px 0 2px}.sub{color:var(--mut);font-size:14px;margin-bottom:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px}.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac)}.summary{display:flex;gap:8px;margin:12px 0}.stat{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:9px 13px;flex:1;font-size:13px;color:var(--mut)}.stat b{display:block;color:var(--tx);font-size:20px}.cat{background:var(--card);border:1px solid var(--bd);border-radius:15px;margin-bottom:13px;overflow:hidden}.cat h2{font-size:16px;margin:0;padding:12px 14px;border-bottom:1px solid var(--bd)}.row{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--bd);min-height:51px}.row:last-of-type{border-bottom:0}.row.on{background:var(--acbg)}.nm{flex:1;min-width:0}.row.on .nm{font-weight:600}.ck{flex:none;width:29px;height:29px;border:2px solid var(--mut);border-radius:8px;background:#fff;color:#fff;font-size:18px;line-height:1;padding:0}.ck.on{background:var(--ac);border-color:var(--ac)}.ctl{display:flex;align-items:center;gap:6px;direction:ltr}.ctl button{width:34px;height:34px;border:0;border-radius:50%;background:var(--btn);color:var(--tx);font-size:21px;line-height:1}.ctl button.p{background:var(--ac);color:white}.ctl button:disabled{opacity:.3}.q{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}.del{border:0;background:transparent;color:#999;font-size:21px;padding:3px 5px}.del:hover{color:#b33}.addrow{display:flex;gap:8px;padding:8px 12px}.addbtn{flex:1;border:1px dashed var(--ac);background:none;color:var(--ac);border-radius:10px;padding:9px;font:inherit;font-weight:600}.ai{flex:1;min-width:0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px;font:inherit}.aok{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:0 15px;font:inherit;font-weight:600}.empty{text-align:center;color:var(--mut);padding:28px}.st{text-align:center;color:var(--mut);font-size:12px;margin-top:8px}
</style></head><body><main>
<div style="font-size:12px;color:#718075;font-weight:700">EYAL NOVO · HOME</div><h1>🛒 רשימת הקניות שלי</h1><div class="sub">כל מה שצריך לבית, במקום אחד</div>
<div class="summary"><div class="stat"><b id="total">0</b>פריטים ברשימה</div><div class="stat"><b id="bought">0</b>סומנו כנקנו</div><div class="stat"><b id="left">0</b>עדיין חסרים</div></div>
<div class="bar"><button class="chip" id="flt">רק מה שחסר</button><button class="chip" id="clr">נקה כמויות</button><button class="chip on" id="wa">שלח בוואטסאפ 💬</button></div>
<div id="list"></div><div class="st" id="st">השינויים נשמרים אוטומטית במכשיר הזה</div></main>
<script>
const CATS=[
["ירקות ופירות","🥬","עגבניות|מלפפונים|חסה|גזר|בצל|שום|תפוחי אדמה|בטטה|פלפלים|לימון|כוסברה|פטרוזיליה|בננות|תפוחים|תפוזים / קלמנטינות|ענבים|מלון|אבטיח"],
["לחם ומאפים","🍞","לחם|פיתות|לחמניות"],
["חלב וביצים","🥛","חלב|ביצים|גבינה לבנה / קוטג׳|גבינה צהובה|יוגורט יווני|שמנת|חמאה לאפייה|חמאה למריחה|לבנה / גבינת שמנת"],
["בשר, עוף ודגים","🍗","חזה עוף|שוקיים / כרעיים|בשר טחון|עוף טחון|נקניקיות / שניצלים|דג (סלמון / אמנון)|טונה"],
["מזווה ויבשים","🍝","אורז|פסטה|קוסקוס|קמח|סוכר|עדשים / חומוס יבש|קורנפלקס / דגנים|שיבולת שועל|ממרח (שוקולד / טחינה)|דבש / ריבה"],
["שימורים, רטבים ותבלינים","🥫","רסק עגבניות|עגבניות מרוסקות|תירס|חומוס / טחינה גולמית|זיתים|מלפפונים חמוצים|קטשופ / מיונז / חרדל|שמן זית|שמן קנולה / חמניות|מלח|פלפל שחור|פפריקה / כמון / כורכום|אבקת אפייה / סודה לשתייה|חומץ"],
["קפואים","🧊","ירקות קפואים|צ׳יפס|בצק עלים|גלידה"],
["חטיפים ומשקאות","🍫","חטיפים מלוחים|עוגיות / ביסקוויטים|שוקולד|אגוזים / פיצוחים|פירות יבשים|מים / סודה|קפה|תה|מיצים|משקאות קלים"],
["ניקיון ונייר","🧽","נוזל כלים|מרכך כביסה|חומר לרצפה|מנקה כללי / אקונומיקה|טבליות למדיח|ספוגים|שקיות אשפה|נייר טואלט|מגבות נייר|נייר אפייה / נייר כסף / שקיות"],
["טואלטיקה ובית מרקחת","🧴","שמפו ומרכך|סבון רחצה / סבון ידיים|משחת שיניים ומברשות|דאודורנט|סכיני גילוח|מגבונים|מוצרי היגיינה אישית|משככי כאבים|פלסטרים|סוללות|נורות"],
["דברים נוספים","➕",""]
].map(c=>[c[0],c[1],c[2]?c[2].split("|"):[]]);
const KEY="eyal-shopping-list-v2";let S={q:{},extra:[],removed:[]},only=false;
try{S={...S,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){}
const $=id=>document.getElementById(id);
function allItems(){return CATS.flatMap((c,ci)=>c[2].map((n,i)=>({id:ci+"-"+i,n,c:ci})).filter(x=>!S.removed.includes(x.id))).concat(S.extra)}
function save(){localStorage.setItem(KEY,JSON.stringify(S));$("st").textContent="נשמר אוטומטית ✓"}
function row(it){const q=S.q[it.id]||0;const el=document.createElement("div");el.className="row"+(q?" on":"");const ck=document.createElement("button");ck.className="ck"+(q?" on":"");ck.textContent=q?"✓":"";ck.setAttribute("aria-label","סמן כמוצר שנקנה");ck.onclick=()=>{S.q[it.id]=q?0:1;save();render()};const nm=document.createElement("span");nm.className="nm";nm.textContent=it.n;const ctl=document.createElement("div");ctl.className="ctl";const minus=document.createElement("button");minus.textContent="−";minus.disabled=!q;minus.onclick=()=>{S.q[it.id]=Math.max(0,q-1);save();render()};const num=document.createElement("span");num.className="q";num.textContent=q;const plus=document.createElement("button");plus.className="p";plus.textContent="+";plus.onclick=()=>{S.q[it.id]=q+1;save();render()};ctl.append(minus,num,plus);const del=document.createElement("button");del.className="del";del.textContent="×";del.title="מחק מוצר מהרשימה";del.setAttribute("aria-label","מחק "+it.n);del.onclick=()=>{if(!confirm('למחוק את "'+it.n+'" מהרשימה?'))return;if(it.custom)S.extra=S.extra.filter(x=>x.id!==it.id);else S.removed.push(it.id);delete S.q[it.id];save();render()};el.append(ck,nm,ctl,del);return el}
function render(){const all=allItems(),active=all.filter(x=>(S.q[x.id]||0)>0),bought=active.filter(x=>S.q[x.id]&&S.done?.[x.id]).length;$("total").textContent=active.length;$("bought").textContent=bought;$("left").textContent=active.length-bought;const root=$("list");root.innerHTML="";CATS.forEach((c,ci)=>{const arr=all.filter(x=>x.c===ci&&(!only||(S.q[x.id]||0)>0));if(!arr.length)return;const sec=document.createElement("section");sec.className="cat";const h=document.createElement("h2");h.textContent=c[1]+" "+c[0];sec.append(h);arr.forEach(it=>sec.append(row(it)));const add=document.createElement("div");add.className="addrow";const inp=document.createElement("input");inp.className="ai";inp.placeholder="הוסף מוצר לקטגוריה…";inp.maxLength=60;const btn=document.createElement("button");btn.className="aok";btn.textContent="הוסף";const addIt=()=>{const n=inp.value.trim();if(!n)return;const id="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.extra.push({id,n,c:ci,custom:true});S.q[id]=1;save();render()};btn.onclick=addIt;inp.onkeydown=e=>{if(e.key==="Enter")addIt()};add.append(inp,btn);if(!only)sec.append(add);root.append(sec)});if(!root.children.length)root.innerHTML='<div class="empty">אין מוצרים שמוצגים כרגע</div>'}
$("flt").onclick=()=>{only=!only;$("flt").classList.toggle("on",only);$("flt").textContent=only?"הצג את כל המוצרים":"רק מה שחסר";render()};
$("clr").onclick=()=>{if(!confirm("לאפס את כל הכמויות? המוצרים יישארו ברשימה."))return;S.q={};save();render()};
$("wa").onclick=()=>{const lines=[];CATS.forEach(c=>{const arr=allItems().filter(x=>x.c===CATS.indexOf(c)&&(S.q[x.id]||0)>0);if(arr.length)lines.push(c[1]+" "+c[0]+"\n"+arr.map(x=>"• "+x.n+(S.q[x.id]>1?" ×"+S.q[x.id]:"")).join("\n"))});if(!lines.length){alert("אין מוצרים מסומנים לשליחה");return}window.open("https://wa.me/?text="+encodeURIComponent("🛒 רשימת הקניות של אייל\n\n"+lines.join("\n\n")),"_blank")};
render();
</script></body></html>
